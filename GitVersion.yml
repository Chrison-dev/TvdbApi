mode: ContinuousDelivery

# Versioning scheme: Major.Minor track the TheTVDB API version (currently 4.7);
# the PATCH is our internal release counter. Releases are cut by tagging
# `v<Major>.<Minor>.<patch>` (e.g. `git tag v4.7.11`) — GitVersion reads the tag
# (tag-prefix 'v'). Untagged builds get a prerelease suffix.

branches:
  main:
    mode: ContinuousDelivery
    increment: None
  develop:
    mode: ContinuousDeployment
    label: 'alpha'
    increment: None
  release:
    mode: ContinuousDelivery
    label: 'beta'
    increment: None
  feature:
    mode: ContinuousDeployment
    label: 'feature'
    increment: None
  hotfix:
    mode: ContinuousDeployment
    label: 'hotfix'
    increment: None

assembly-versioning-scheme: MajorMinorPatch
assembly-file-versioning-scheme: MajorMinorPatchTag

tag-prefix: 'v'

# Keep major.minor.patch static by not incrementing any version component
# The build metadata and prerelease tags will provide uniqueness
